name: Akbura Templates

on:
  workflow_dispatch:
    inputs:
      verification_mode:
        description: Template verification depth
        required: true
        default: Sampled
        type: choice
        options:
          - Sampled
          - Smoke
          - Full
  pull_request:
    paths:
      - "src/Akbura.Templates/**"
      - "src/Akbura/**"
      - "src/Akbura.BlackSilence/**"
      - "src/Akbura.Build.Tasks/**"
      - "src/Akbura.Diagnostics/**"
      - "src/Akbura.Generator/**"
      - "eng/Verify-AkburaTemplates.ps1"
      - "eng/Verify-AkburaNewTemplates.ps1"
      - "eng/AkburaTemplateVerificationPlan.psm1"
      - "eng/Test-AkburaTemplateVerificationPlan.ps1"
      - "eng/Verify-AkburaXplatPlatform.ps1"
      - "eng/Set-AkburaTemplateVersions.ps1"
      - "eng/TemplateRuntimeProbe/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - ".github/workflows/akbura-templates.yml"
  push:
    branches:
      - master
    paths:
      - "src/Akbura.Templates/**"
      - "src/Akbura/**"
      - "src/Akbura.BlackSilence/**"
      - "src/Akbura.Build.Tasks/**"
      - "src/Akbura.Diagnostics/**"
      - "src/Akbura.Generator/**"
      - "eng/Verify-AkburaTemplates.ps1"
      - "eng/Verify-AkburaNewTemplates.ps1"
      - "eng/AkburaTemplateVerificationPlan.psm1"
      - "eng/Test-AkburaTemplateVerificationPlan.ps1"
      - "eng/Verify-AkburaXplatPlatform.ps1"
      - "eng/Set-AkburaTemplateVersions.ps1"
      - "eng/TemplateRuntimeProbe/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - ".github/workflows/akbura-templates.yml"

permissions: {}

concurrency:
  group: akbura-templates-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.verification_mode || 'Sampled' }}
  cancel-in-progress: true

env:
  AKBURA_PROJECT: src/Akbura/Akbura.csproj
  DIAGNOSTICS_PROJECT: src/Akbura.Diagnostics/Akbura.Diagnostics.csproj
  TEMPLATES_PROJECT: src/Akbura.Templates/Akbura.Templates.csproj
  ARTIFACTS_PATH: artifacts/templates
  VERIFICATION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_mode || 'Sampled' }}

jobs:
  verify:
    name: Pack and verify templates
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_mode == 'Full' && 240 || 90 }}
    permissions:
      contents: read
    outputs:
      version: ${{ steps.versions.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Test template verification planner
        shell: pwsh
        run: ./eng/Test-AkburaTemplateVerificationPlan.ps1

      - name: Prepare CI package version
        id: versions
        shell: pwsh
        run: |
          $properties = [xml] (
              Get-Content -LiteralPath "Directory.Build.props" -Raw)
          $avaloniaVersion = [string] (
              $properties.Project.PropertyGroup.AvaloniaVersion |
                  Select-Object -First 1)

          if ([string]::IsNullOrWhiteSpace($avaloniaVersion)) {
              throw "Directory.Build.props does not define AvaloniaVersion."
          }

          $version = "$avaloniaVersion-ci.$env:GITHUB_RUN_NUMBER"
          "avalonia_version=$avaloniaVersion" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set template package defaults
        shell: pwsh
        env:
          AKBURA_VERSION: ${{ steps.versions.outputs.version }}
          AVALONIA_VERSION: ${{ steps.versions.outputs.avalonia_version }}
        run: |
          ./eng/Set-AkburaTemplateVersions.ps1 `
              -AkburaVersion $env:AKBURA_VERSION `
              -AvaloniaVersion $env:AVALONIA_VERSION

      - name: Restore package projects
        shell: bash
        run: |
          set -euo pipefail

          dotnet restore "$AKBURA_PROJECT"
          dotnet restore "$DIAGNOSTICS_PROJECT"
          dotnet restore "$TEMPLATES_PROJECT"

      - name: Pack runtime, diagnostics, and templates
        shell: bash
        env:
          VERSION: ${{ steps.versions.outputs.version }}
        run: |
          set -euo pipefail

          dotnet pack "$AKBURA_PROJECT" \
            --configuration Release \
            --no-restore \
            --output "$ARTIFACTS_PATH" \
            -p:PackageVersion="$VERSION" \
            -p:ContinuousIntegrationBuild=true

          dotnet pack "$DIAGNOSTICS_PROJECT" \
            --configuration Release \
            --no-restore \
            --output "$ARTIFACTS_PATH" \
            -p:PackageVersion="$VERSION" \
            -p:ContinuousIntegrationBuild=true

          dotnet pack "$TEMPLATES_PROJECT" \
            --configuration Release \
            --no-restore \
            --output "$ARTIFACTS_PATH" \
            -p:PackageVersion="$VERSION" \
            -p:ContinuousIntegrationBuild=true

      - name: Verify packaged template defaults
        shell: pwsh
        env:
          VERSION: ${{ steps.versions.outputs.version }}
          AVALONIA_VERSION: ${{ steps.versions.outputs.avalonia_version }}
        run: |
          ./eng/Set-AkburaTemplateVersions.ps1 `
              -AkburaVersion $env:VERSION `
              -AvaloniaVersion $env:AVALONIA_VERSION `
              -VerifyPackagePath "$env:ARTIFACTS_PATH/Akbura.Templates.$env:VERSION.nupkg"

      - name: Upload template package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: akbura-templates-${{ steps.versions.outputs.version }}
          path: artifacts/templates/*.nupkg
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # The selected matrix is persisted before execution. A failed case must
      # be replayed from this artifact, never replaced by a fresh sample.
      - name: Prepare template verification plan
        shell: pwsh
        env:
          VERSION: ${{ steps.versions.outputs.version }}
          AVALONIA_VERSION: ${{ steps.versions.outputs.avalonia_version }}
        run: |
          ./eng/Verify-AkburaTemplates.ps1 `
              -Version $env:VERSION `
              -AvaloniaVersion $env:AVALONIA_VERSION `
              -Feed $env:ARTIFACTS_PATH `
              -WorkingDirectory $env:RUNNER_TEMP `
              -Mode $env:VERIFICATION_MODE `
              -PlanOutputPath "$env:RUNNER_TEMP/template-verification-plan.json" `
              -PlanOnly

      - name: Upload template verification plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: akbura-template-verification-plan-${{ steps.versions.outputs.version }}-${{ env.VERIFICATION_MODE }}
          path: ${{ runner.temp }}/template-verification-plan.json
          if-no-files-found: error
          retention-days: 14

      - name: Run ${{ env.VERIFICATION_MODE }} template verification
        timeout-minutes: ${{ env.VERIFICATION_MODE == 'Full' && 190 || 60 }}
        shell: pwsh
        env:
          VERSION: ${{ steps.versions.outputs.version }}
          AVALONIA_VERSION: ${{ steps.versions.outputs.avalonia_version }}
        run: |
          ./eng/Verify-AkburaTemplates.ps1 `
              -Version $env:VERSION `
              -AvaloniaVersion $env:AVALONIA_VERSION `
              -Feed $env:ARTIFACTS_PATH `
              -WorkingDirectory $env:RUNNER_TEMP `
              -Mode $env:VERIFICATION_MODE `
              -SelectionManifest "$env:RUNNER_TEMP/template-verification-plan.json" `
              -ReportOutputPath "$env:RUNNER_TEMP/template-verification-report.json" `
              -BinLogDirectory "$env:RUNNER_TEMP/akbura-template-binlogs"

      - name: Upload template verification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: akbura-template-verification-report-${{ steps.versions.outputs.version }}-${{ env.VERIFICATION_MODE }}
          path: ${{ runner.temp }}/template-verification-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failed verification binlogs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: akbura-template-binlogs-${{ steps.versions.outputs.version }}-${{ env.VERIFICATION_MODE }}
          path: ${{ runner.temp }}/akbura-template-binlogs/**
          if-no-files-found: warn
          retention-days: 14

  browser:
    name: Build and publish packaged xplat Browser
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_mode == 'Full' && 90 || 45 }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Install WebAssembly workload
        shell: bash
        run: sudo dotnet workload install wasm-tools --skip-manifest-update

      - name: Download local CI packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: akbura-templates-${{ needs.verify.outputs.version }}
          path: ${{ runner.temp }}/akbura-template-feed

      - name: Verify packaged Browser host
        timeout-minutes: 25
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          ./eng/Verify-AkburaXplatPlatform.ps1 `
              -Platform Browser `
              -Toolkit ReactiveUI `
              -Version $env:VERSION `
              -Feed "${{ runner.temp }}/akbura-template-feed" `
              -WorkingDirectory "${{ runner.temp }}" `
              -BinLogDirectory "${{ runner.temp }}/akbura-template-binlogs-browser"

      - name: Verify packaged Browser host with complementary toolkit
        if: env.VERIFICATION_MODE == 'Full'
        timeout-minutes: 25
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          ./eng/Verify-AkburaXplatPlatform.ps1 `
              -Platform Browser `
              -Toolkit CommunityToolkit `
              -Version $env:VERSION `
              -Feed "${{ runner.temp }}/akbura-template-feed" `
              -WorkingDirectory "${{ runner.temp }}" `
              -BinLogDirectory "${{ runner.temp }}/akbura-template-binlogs-browser"

      - name: Upload failed Browser binlogs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: akbura-template-binlogs-browser-${{ needs.verify.outputs.version }}
          path: ${{ runner.temp }}/akbura-template-binlogs-browser/**
          if-no-files-found: warn
          retention-days: 14

  android:
    name: Build packaged xplat Android
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_mode == 'Full' && 90 || 45 }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Install Android workload
        shell: bash
        run: sudo dotnet workload install android --skip-manifest-update

      - name: Download local CI packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: akbura-templates-${{ needs.verify.outputs.version }}
          path: ${{ runner.temp }}/akbura-template-feed

      - name: Verify packaged Android host
        timeout-minutes: 25
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          ./eng/Verify-AkburaXplatPlatform.ps1 `
              -Platform Android `
              -Toolkit CommunityToolkit `
              -Version $env:VERSION `
              -Feed "${{ runner.temp }}/akbura-template-feed" `
              -WorkingDirectory "${{ runner.temp }}" `
              -BinLogDirectory "${{ runner.temp }}/akbura-template-binlogs-android"

      - name: Verify packaged Android host with complementary toolkit
        if: env.VERIFICATION_MODE == 'Full'
        timeout-minutes: 25
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          ./eng/Verify-AkburaXplatPlatform.ps1 `
              -Platform Android `
              -Toolkit ReactiveUI `
              -Version $env:VERSION `
              -Feed "${{ runner.temp }}/akbura-template-feed" `
              -WorkingDirectory "${{ runner.temp }}" `
              -BinLogDirectory "${{ runner.temp }}/akbura-template-binlogs-android"

      - name: Upload failed Android binlogs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: akbura-template-binlogs-android-${{ needs.verify.outputs.version }}
          path: ${{ runner.temp }}/akbura-template-binlogs-android/**
          if-no-files-found: warn
          retention-days: 14

  ios:
    name: Build packaged xplat iOS simulator
    needs: verify
    runs-on: macos-26
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_mode == 'Full' && 180 || 90 }}
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET 10.0.401
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.401"

      - name: Verify Xcode and install iOS workload
        shell: bash
        run: |
          set -euo pipefail
          test "$(xcodebuild -version | head -n 1)" = "Xcode 26.6"
          dotnet workload install ios --version 10.0.401

      - name: Download local CI packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: akbura-templates-${{ needs.verify.outputs.version }}
          path: ${{ runner.temp }}/akbura-template-feed

      - name: Verify packaged iOS simulator host
        timeout-minutes: 60
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          ./eng/Verify-AkburaXplatPlatform.ps1 `
              -Platform iOS `
              -Toolkit CommunityToolkit `
              -Version $env:VERSION `
              -Feed "${{ runner.temp }}/akbura-template-feed" `
              -WorkingDirectory "${{ runner.temp }}" `
              -BinLogDirectory "${{ runner.temp }}/akbura-template-binlogs-ios"

      - name: Verify packaged iOS simulator host with complementary toolkit
        if: env.VERIFICATION_MODE == 'Full'
        timeout-minutes: 60
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          ./eng/Verify-AkburaXplatPlatform.ps1 `
              -Platform iOS `
              -Toolkit ReactiveUI `
              -Version $env:VERSION `
              -Feed "${{ runner.temp }}/akbura-template-feed" `
              -WorkingDirectory "${{ runner.temp }}" `
              -BinLogDirectory "${{ runner.temp }}/akbura-template-binlogs-ios"

      - name: Upload failed iOS binlogs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: akbura-template-binlogs-ios-${{ needs.verify.outputs.version }}
          path: ${{ runner.temp }}/akbura-template-binlogs-ios/**
          if-no-files-found: warn
          retention-days: 14
